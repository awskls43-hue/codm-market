<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CODM MARKET | بازار کالاف</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d16;color:white;font-family:Tahoma,Arial}
header{padding:25px 15px;text-align:center;background:linear-gradient(135deg,#141c36,#5425a7)}
h1{color:#bba0ff;margin:0 0 10px}
header p{color:#ddd}
.container{max-width:900px;margin:auto;padding:18px}
.search,input,select,textarea{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #343d52;background:#121a29;color:white}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button{border:0;padding:12px 16px;border-radius:9px;background:#713cf3;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#895cff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#121a29;border:1px solid #29334a;border-radius:14px;padding:15px}
.card h3{color:#c5adff}
.price{font-size:20px;color:#64ffae;font-weight:bold}
.badge{display:inline-block;background:#30204e;color:#d5c1ff;padding:5px 8px;border-radius:6px}
form{background:#121a29;padding:16px;border-radius:14px;margin-top:28px}
small{color:#b9c1d1}
footer{text-align:center;padding:25px;color:#8993a8}
</style>
</head>
<body>
<header>
<h1>🎮 CODM MARKET</h1>
<p>بازار خرید و فروش اکانت کالاف موبایل</p>
<span class="badge">خرید • فروش • تبادل</span>
</header>
<div class="container">
<h2>🔎 پیدا کردن اکانت</h2>
<input id="search" class="search" placeholder="نام اکانت یا آیتم موردنظر..." oninput="showAds()">
<div class="buttons">
<button onclick="filterPrice('all')">همه اکانت‌ها</button>
<button onclick="filterPrice('low')">زیر یک میلیون</button>
<button onclick="filterPrice('high')">یک میلیون به بالا</button>
</div>
<div id="ads" class="grid"></div>

<form id="adForm">
<h2>➕ ثبت آگهی فروش</h2>
<input id="title" placeholder="عنوان اکانت (مثلاً لجندری)" required>
<input id="price" type="number" min="1" placeholder="قیمت به تومان" required>
<textarea id="description" placeholder="توضیحات اکانت: لول، گان‌ها و اسکین‌ها"></textarea>
<input id="contact" placeholder="راه ارتباطی برای خریدار" required>
<button type="submit">ثبت آگهی روی این دستگاه</button>
<p><small>این نسخه آزمایشی است؛ آگهی‌ها فعلاً فقط در همین مرورگر ذخیره می‌شوند.</small></p>
</form>
<footer>CODM MARKET © 2026</footer>
</div>
<script>
let ads=JSON.parse(localStorage.getItem('codmAds')||'[]');
let filter='all';
function save(){localStorage.setItem('codmAds',JSON.stringify(ads));showAds()}
function filterPrice(f){filter=f;showAds()}
function showAds(){
let q=document.getElementById('search').value.toLowerCase();
let list=ads.filter(a=>a.title.toLowerCase().includes(q)&&
(filter==='all'||(filter==='low'&&a.price<1000000)||(filter==='high'&&a.price>=1000000)));
document.getElementById('ads').innerHTML=list.length?list.map(a=>`
<div class="card"><span class="badge">اکانت کالاف موبایل</span>
<h3>${escapeHTML(a.title)}</h3><div class="price">${a.price.toLocaleString('fa-IR')} تومان</div>
<p>${escapeHTML(a.description||'بدون توضیحات')}</p>
<p>ارتباط: ${escapeHTML(a.contact)}</p></div>`).join(''):'<p>هنوز آگهی‌ای ثبت نشده است.</p>';
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('adForm').addEventListener('submit',e=>{
e.preventDefault();
ads.unshift({
title:document.getElementById('title').value,
price:Number(document.getElementById('price').value),
description:document.getElementById('description').value,
contact:document.getElementById('contact').value
});
save();e.target.reset();alert('آگهی در همین دستگاه ذخیره شد.');
});
showAds();
</script>
</body>
</html>
